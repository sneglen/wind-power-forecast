[project]
name = "wpforecast"
version = "0.1.0"
description = "DK1 day-ahead wind power forecasts as calibrated, self-adapting predictive distributions, with an imbalance-market backtest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enrique Vidal Sanchez" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dynamical-catalog>=0.8.0",
    "httpx>=0.27",
    "lightgbm>=4.7.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "scoringrules>=0.11.0",
    "statsmodels>=0.15.0",
    "tenacity>=9.0",
    "xarray>=2024.9",
]

[project.scripts]
wpforecast = "wpforecast.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wpforecast"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = ["smoke: end-to-end pipeline run on the committed sample"]
