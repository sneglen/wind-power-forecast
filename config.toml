# wind-power-forecast — single source of truth for dates, points, quantiles and hyper-parameters.
# All timestamps are handled in UTC internally; local time only appears in [issue].
# Values marked "placeholder" are tuned in the step that introduces the corresponding method.

[paths]
raw = "data/raw"              # download cache: responses as received (`make data`)
interim = "data/interim"      # cleaned UTC tables built from the cache
outputs = "outputs"
figures = "figures"
reports = "reports"           # committed reports, e.g. the data check

[data]
start = 2024-03-14            # first UTC day downloaded (Open-Meteo HRES archive start)
end = 2026-10-25              # last UTC day downloaded; fixed so the snapshot is reproducible
offline = false               # true: never touch the network, fail if the cache is incomplete
price_area = "DK1"

[data.eds]                    # Energi Data Service (Energinet), CC BY 4.0
base_url = "https://api.energidataservice.dk"
min_interval_s = 5.0          # pause between requests; the API returns 429 on bursts

[data.openmeteo]              # Open-Meteo Single Runs API, free tier, CC BY 4.0
base_url = "https://single-runs-api.open-meteo.com/v1/forecast"
calls_per_hour = 4500         # free tier: 5000 / hour, 10000 / day
calls_per_day = 9800         # 200 below the limit; the ledger is shared by all configs
calls_per_location = 1.0      # conservative: each location in a request counts as a call
min_interval_s = 1.0
max_wait_min = 60.0           # wait this long for the rolling daily budget to free up, else stop

[dates]
# Target days (local). The last 3 months of training are the validation set.
train_start = 2024-04-01      # HRES 00 UTC runs complete from here
validation_start = 2024-12-01
train_end = 2025-02-28
test_start = 2025-03-01       # pre-Thor test year with full imbalance-price coverage
test_end = 2026-02-28
stress_start = 2026-03-01     # Thor ramp-up, IFS cycle 50r1
# stress_end = 2026-09-30     # omit: run to the latest day in the data

[issue]
# Forecasts for local day D are issued on D-1 at `time_local`, from information available then.
# Horizon k = hours from issue to the END of the target hour, k = 1..max_horizon_h.
# The day-ahead product (local day D) is k = 14..37, i.e. lead times 13-37 h.
timezone = "Europe/Copenhagen"
time_local = "11:00"
gate_closure_local = "12:00"  # day-ahead auction gate closure
max_horizon_h = 38            # plan: 1-37; +1 covers the 25-hour autumn DST day
power_lag_h = 0               # production known up to the issue time (real-time metering)

[nwp]
# Core input: ECMWF IFS HRES 9 km (O1280 grid) via Open-Meteo Single Runs API.
source = "open-meteo"
model = "ecmwf_ifs"
# Core: 100 m speed (m/s) and direction (deg). Extras cost nothing (<= 10 variables per call)
# and spare a re-download: shear (10/120 m), gusts (max over the past hour, none at lead 0),
# air density (2 m temperature in C, surface pressure in hPa).
variables = [
    "wind_speed_100m", "wind_direction_100m",
    "wind_speed_10m", "wind_speed_120m", "wind_gusts_10m",
    "temperature_2m", "surface_pressure",
]
cycle_utc = 0
availability_lag_h = 7        # observed 6.1-6.5 h on Open-Meteo (2026-10-26/27)
max_lead_h = 72

[nwp.ensemble]
# Extension A (Step 8): ECMWF IFS ENS via dynamical.org (dynamical-catalog), CC BY 4.0.
# Downloaded with `make ens`; only the values at [points] are kept.
source = "dynamical.org"
dataset = "ecmwf-ifs-ens-forecast-15-day-0-25-degree"
start = 2024-04-01            # first 00 UTC run in the archive
variables = ["wind_u_100m", "wind_v_100m"]
members = 51
resolution_deg = 0.25
step_h = 3                    # 3-hourly to 144 h; interpolated to hourly in Step 8
# ECMWF disseminates the 00 UTC ENS to step 144 by 07:04 UTC and open data follow one hour
# later (dissemination schedule, checked 2026-10-28): usable from 09:00 UTC, the summer issue.
availability_lag_h = 9
max_lead_h = 72               # same reach as HRES
workers = 4                   # runs fetched in parallel (~4 s each, one chunk per variable)

# NWP extraction points (lat, lon). Onshore points use land grid cells, offshore points sea
# cells (Open-Meteo `cell_selection`); every point is within 7 km of its grid cell.
[points.onshore]              # 0.5 deg grid over Jutland and Funen
on_5750_1000 = [57.50, 10.00]
on_5700_0850 = [57.00, 8.50]
on_5700_0950 = [57.00, 9.50]
on_5650_0850 = [56.50, 8.50]
on_5650_0900 = [56.50, 9.00]
on_5650_1000 = [56.50, 10.00]
on_5600_0850 = [56.00, 8.50]
on_5600_0900 = [56.00, 9.00]
on_5550_0850 = [55.50, 8.50]
on_5550_0950 = [55.50, 9.50]
on_5550_1000 = [55.50, 10.00]
on_5500_0900 = [55.00, 9.00]

[points.offshore]
horns_rev_1 = [55.53, 7.91]
horns_rev_2 = [55.60, 7.58]
horns_rev_3 = [55.70, 7.69]
vesterhav_nord = [56.68, 8.06]
vesterhav_syd = [56.03, 8.03]
anholt = [56.60, 11.21]
thor = [56.36, 7.76]          # 22 km off Thorsminde; regime-change extension (Step 9)

[target]
# DK1 onshore + offshore production / installed capacity C(t), modelled as one total.
resolution = "1h"             # one hourly bid repeated over four 15-min MTUs

[curtailment]
# Hours with day-ahead price <= threshold are flagged, dropped from fitting and scored both ways.
# DA prices are published after issue time, so they are never a feature.
da_price_max = 0.0

[quantiles]
levels = [
    0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
    0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95,
]
crps_levels = 99              # CRPS approximated from tau = 0.01 .. 0.99
# Step 5 models are fitted at levels + tail_levels and interpolated in tau to the CRPS grid.
tail_levels = [0.01, 0.02, 0.98, 0.99]

[adaptivity]
regimes = ["frozen", "walk_forward", "recursive"]
walk_forward_refit = "monthly"

[model.baselines]
# Step 3: climatology, persistence and the new reference, refit monthly on all known data.
min_error_samples = 30        # error quantiles at horizon k need this many past errors

[model.rls]
# Step 4: adaptive power curve. Forgetting lambda acts per hourly row: memory ~ 1/(1-lambda)
# rows, ~37 rows per day. The value is chosen on the validation period from this grid
# (RMSE of the point forecast); 1.0 is the frozen / walk-forward twin.
forgetting_grid = [0.999, 0.9995, 0.9998, 0.9999, 1.0]
delta = 100.0                 # regularised start P0 = delta * I; trace(P) bounded by trace(P0)
spline_knots = 6              # interior knots of the cubic B-spline in 100 m wind speed
spline_degree = 3
# Knots spread uniformly over [0, speed_max] per region; faster is clamped. Regional means
# rarely pass 17 m/s onshore (99.9 % quantile, 2024-25) but reach 26 m/s offshore.
speed_max_ms = { onshore = 20.0, offshore = 28.0 }
diurnal_harmonics = 2         # sin/cos of 2 pi m h / 24, m = 1..2 (UTC hour)
horizon_blocks = [1, 7, 13, 19, 25, 31]  # first k of each block of the correction a_k
error_window_days = 90        # past errors used for the empirical predictive quantiles

[model.probabilistic]
# Step 5: predictive distributions on top of the RLS power curve's point forecast p.
min_train_rows = 200          # a layer forecasts only once it has this many training rows

[model.quantreg]
# Adaptive quantile regression: q_tau = [B(p), B(p) k / max_horizon_h]' gamma_tau.
window_days = 180             # rolling window
refit_days = 7                # weekly refit
spline_knots = 5              # interior knots of the B-spline in p over [0, 1]
spline_degree = 3

[model.logitnormal]
# Generalised logit-normal: z = log(y^nu / (1 - y^nu)) ~ N(mu, sigma^2), censored at
# [epsilon, 1 - epsilon]; mu and log sigma linear in z(p), z(p)^2 and k. Refit monthly.
nu = 1.0
epsilon = 0.001               # y <= epsilon (>= 1 - epsilon) counts as at the bound

[model.gbm]
# LightGBM quantile regression, one model per fitted level, refit monthly on all known data.
learning_rate = 0.05
num_leaves = 15
n_estimators = 300
min_child_samples = 50
num_threads = 4               # more threads spin-wait when other processes share the CPU
features = [
    "wind_speed_100m@onshore", "wind_speed_100m@offshore",
    "u_100m@onshore", "v_100m@onshore", "u_100m@offshore", "v_100m@offshore",
    "wind_speed_10m@onshore", "wind_gusts_10m@onshore", "temperature_2m@onshore",
    "surface_pressure@onshore",
]

[evaluation]
# Step 6: test-year verification (Madsen et al. 2005; Pinson et al. 2007).
bootstrap_block_days = 1      # moving-block bootstrap over days: errors within a day are dependent
n_bootstrap = 1000
band = 0.90                   # bootstrap bands and intervals for skill and reliability
intervals = [0.5, 0.8, 0.9]   # central prediction intervals: coverage and width (sharpness)
pit_bins = 10
min_hours_per_horizon = 30   # by-horizon plots skip rare k (k = 38: autumn DST days only)
dm_max_lag = 7                # Newey-West lags (days) for the Diebold-Mariano variance
seed = 0                      # bootstrap and PIT randomisation
spread_bins = 10              # Step 8 spread-skill plot: bins of equal size by predicted spread

[market]
# Step 7: imbalance cost of day-ahead bids under DK1 single pricing (EUR per MWh produced).
area = "DK1"
pricing = "single"            # single imbalance price
portfolio_mw = 100.0          # price-taker portfolio producing y * 100 MW
start = 2025-03-19            # one imbalance-price method throughout
end = 2026-02-28
tau_lookback_days = 60        # walk-forward choice of the bid quantile
tau_min_days = 14             # fewer trailing days than this: bid the median
reference_model = "logitnormal"  # the model behind the position analysis and the tau figure
spike_eur_mwh = 1000.0        # |DA - imbalance price| above this: a scarcity hour, shown apart
