# Smoke-run config: inherits config.toml, points at the committed synthetic sample
# (2025-01-01 .. 2025-01-21 UTC) and shrinks every window so the pipeline runs in seconds.
base = "../../config.toml"

[paths]
raw = "data/sample/dk1_synthetic.csv"
interim = "outputs/smoke/interim"
outputs = "outputs/smoke"
figures = "outputs/smoke/figures"

[dates]
train_start = 2025-01-07
validation_start = 2025-01-09
train_end = 2025-01-10
test_start = 2025-01-11
test_end = 2025-01-17
stress_start = 2025-01-18
stress_end = 2025-01-20

[market]
start = 2025-01-12
end = 2025-01-17

[model.climatology]
window_days = 5
