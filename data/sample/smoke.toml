# Smoke-run config: inherits config.toml and runs the whole pipeline offline on a small
# committed slice of real DK1 data (UTC days 2025-03-08 .. 2025-03-31). The slice covers
# single-price imbalance settlement (from 2025-03-19) and the spring DST day (2025-03-30).
# Refresh it with `make sample` (downloads ~25 runs and 6 EDS chunks).
base = "../../config.toml"

[paths]
raw = "data/sample/raw"
interim = "outputs/smoke/interim"
outputs = "outputs/smoke"
figures = "outputs/smoke/figures"
reports = "outputs/smoke/reports"

[data]
start = 2025-03-08
end = 2025-03-31
offline = true

[dates]
train_start = 2025-03-14
validation_start = 2025-03-17
train_end = 2025-03-19
test_start = 2025-03-20
test_end = 2025-03-27
stress_start = 2025-03-28
stress_end = 2025-03-31

[market]
start = 2025-03-20
end = 2025-03-27
tau_min_days = 3              # an 8-day window

[model.baselines]
min_error_samples = 3         # the sample has only a few days per horizon

[evaluation]
min_hours_per_horizon = 1     # an 8-day test period has 8 hours per horizon
n_bootstrap = 200
